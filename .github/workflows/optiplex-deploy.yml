name: OptiPlex Deploy & Verify

# Never trigger on pull_request — this runs on a self-hosted runner
# (docs/optiplex-ci-plan.md).
on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: optiplex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, optiplex]
    timeout-minutes: 60
    steps:
      - name: Prepare workspace permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || \
            docker run --rm -v "$GITHUB_WORKSPACE:/workspace" ubuntu:22.04 \
              chown -R "$(id -u):$(id -g)" /workspace || true
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep generated test artifacts out of checkout's full wipe path; some
          # Playwright trace dirs can be owned by browser sandbox users.
          clean: false

      - name: Remove stale untracked source files
        run: |
          git clean -ffdx \
            -e e2e/test-results/ \
            -e e2e/playwright-report/ \
            -e airline-data/target/ \
            -e airline-web/target/ \
            -e data/logos/

      - name: Deploy stack
        env:
          # -Xmx2048M: full-dataset cycles need more than the start script's 1.5G.
          # solo.*: friendlier single-player economy + financial notifications
          # (see com.patson.data.SoloConfig). Tune these freely — they only
          # affect this self-hosted instance.
          # -Xmx2816M: headroom for the ~635MB Step E-1 base-demand cache on top
          # of the ~1.8G working set (container mem_limit raised to match).
          SIM_SOLO_OPTS: >-
            -Xmx2816M
            -Dsolo.ap.generationRate=0.3
            -Dsolo.loan.defaultAnnualRate=0.06
            -Dsolo.bankruptcy.cashThreshold=-25000000
            -Dsolo.bankruptcy.assetsThreshold=-150000000
            -Dsolo.notify.enabled=true
            -Dsolo.negotiationReady.enabled=true
            -Dsolo.ai.enabled=true
            -Dsolo.ai.growth.enabled=true
            -Dsolo.ai.pricetune.enabled=true
            -Dsolo.ai.fleet.enabled=true
            -Dsolo.ai.bases.enabled=true
            -Dsolo.airportAssets.enabled=true
            -Dsolo.cargo.enabled=true
            -Dsolo.cargo.captureRatio=0.5
            -Dsolo.cargo.revenuePerUnitKm=0.01
            -Dsolo.cargo.assets.enabled=true
            -Dsolo.cargo.freighters.enabled=true
            -Dsolo.news.enabled=true
            -Dsolo.demand.memoize=true
            -Dsolo.progression.enabled=true
            -Dsolo.consultant.enabled=true
            -Dsolo.exec.enabled=true
            -Dsolo.alliance.minMembers=2
            -Dsolo.routeForecast.enabled=true
          # Web process (sign-up + tooltips): starting capital and the same
          # economy display values so tooltips match the simulation.
          # alliance.minMembers must match the sim so alliance status agrees across JVMs;
          # lounge.allowWithoutAlliance gates the web-side lounge build.
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          WEB_SOLO_OPTS: >-
            -Dsolo.startingBalance=25000000
            -Dsolo.minRenewalBalance=100000
            -Dsolo.ap.generationRate=0.3
            -Dsolo.loan.defaultAnnualRate=0.06
            -Dsolo.bankruptcy.cashThreshold=-25000000
            -Dsolo.bankruptcy.assetsThreshold=-150000000
            -Dsolo.consultant.enabled=true
            -Dsolo.airportAssets.enabled=true
            -Dsolo.cargo.enabled=true
            -Dsolo.cargo.captureRatio=0.5
            -Dsolo.cargo.revenuePerUnitKm=0.01
            -Dsolo.cargo.assets.enabled=true
            -Dsolo.cargo.freighters.enabled=true
            -Dsolo.lounge.allowWithoutAlliance=true
            -Dsolo.alliance.minMembers=2
            -Dsolo.exec.enabled=true
            -Dsolo.routeForecast.enabled=true
            -Dassets.version=${{ github.sha }}
            -Dsolo.push.enabled=true
            -Dsolo.push.vapidPublicKey=${{ secrets.SOLO_PUSH_VAPID_PUBLIC_KEY }}
            -Dsolo.push.vapidPrivateKey=${{ secrets.SOLO_PUSH_VAPID_PRIVATE_KEY }}
            -Dsolo.push.vapidSubject=${{ secrets.SOLO_PUSH_VAPID_SUBJECT }}
            -Dsolo.push.adminAirlineId=34
        run: bash scripts/optiplex-deploy.sh

      - name: Install e2e dependencies
        run: |
          npm ci --prefix e2e
          npx --prefix e2e playwright install chromium

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:9000
        run: npm test --prefix e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore

      - name: Collect logs and job summary
        if: always()
        run: |
          {
            echo "## Container resource usage"
            echo '```'
            docker stats --no-stream || true
            echo '```'
            echo "## Simulation log (cycle timings, last 40 lines)"
            echo '```'
            docker exec airline-app sh -c 'grep -i cycle /home/airline/sim.log | tail -40' \
              || docker exec airline-app sh -c 'tail -40 /home/airline/sim.log' \
              || echo "no sim log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
