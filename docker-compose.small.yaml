# Single-player / small-server profile (8 GB RAM class host).
# Same image and mounts as docker-compose.yaml, with memory limits,
# tuned MySQL, and no Elasticsearch. See SMALL_SERVER.md for usage.

networks:
  airline: {}

volumes:
  mysql-data: {}

services:
  airline-app:
    container_name: airline-app
    restart: unless-stopped
    # PID 1 is `tail`, which never reaps the healthcheck's curl zombies;
    # tini does.
    init: true
    build:
      context: .
      dockerfile: .docker/Dockerfile
    depends_on:
      - airline-db
    volumes:
      - ".:/home/airline/airline"
      - "./.docker/data/init.sh:/home/airline/init-data.sh"
      - "./.docker/data/start.sh:/home/airline/start-data.sh"
      - "./.docker/web/start.sh:/home/airline/start-web.sh"
      - "./.docker/web/clean.sh:/home/airline/clean-web.sh"
      - "./.docker/app/start-small.sh:/home/airline/start-small.sh"
    environment:
      DB_HOST: airline-db
      WEB_EXTRA_OPTS: "-Dmysqldb.host=airline-db:3306 ${WEB_SOLO_OPTS:--Dsolo.consultant.enabled=true -Dsolo.progression.enabled=true -Dsolo.news.enabled=true -Dsolo.lounge.allowWithoutAlliance=true -Dsolo.alliance.minMembers=2}"
      SIM_EXTRA_OPTS: "-Dmysqldb.host=airline-db:3306 -Dsimulation.pauseWhenIdle=true ${SIM_SOLO_OPTS:--Dsolo.ap.generationRate=0.3 -Dsolo.loan.defaultAnnualRate=0.06 -Dsolo.bankruptcy.cashThreshold=-25000000 -Dsolo.bankruptcy.assetsThreshold=-150000000 -Dsolo.notify.enabled=true -Dsolo.negotiationReady.enabled=true -Dsolo.demand.profile=true -Dsolo.link.profile=true -Dsolo.ai.enabled=true -Dsolo.ai.strategy.enabled=true -Dsolo.consultant.enabled=true -Dsolo.progression.enabled=true -Dsolo.news.enabled=true -Dsolo.lounge.allowWithoutAlliance=true -Dsolo.alliance.minMembers=2}"
    entrypoint: ["sh", "/home/airline/start-small.sh"]
    # Required for docker inside an unprivileged LXC, where securityfs is
    # unreadable and the docker-default AppArmor profile can never load.
    # No-op on hosts without AppArmor.
    security_opt:
      - apparmor=unconfined
    # Holds both the simulation JVM (~3G heap with demand/cache work) and the
    # web JVM (~1G heap). The current OptiPlex guest has 16 GB RAM.
    mem_limit: 7g
    ports:
      - "9000:9000"
    healthcheck:
      test: curl --fail http://localhost:9000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - airline

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: airline-cloudflared
    restart: unless-stopped
    depends_on:
      - airline-app
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - airline

  airline-db:
    # bitnami/ images were removed from Docker Hub in 2025; bitnamilegacy is
    # the frozen archive of the same image.
    image: bitnamilegacy/mysql:8.0
    container_name: airline-db
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    environment:
      MYSQL_DATABASE: airline
      MYSQL_USER: mfc01
      MYSQL_PASSWORD: ghEtmwBdnXYBQH4
      MYSQL_CHARACTER_SET: utf8mb4
      MYSQL_COLLATE: utf8mb4_unicode_ci
      ALLOW_EMPTY_PASSWORD: yes
    mem_limit: 1500m
    volumes:
      - "mysql-data:/bitnami/mysql"
      - "./.docker/db/small.cnf:/opt/bitnami/mysql/conf/my_custom.cnf:ro"
    networks:
      - airline
