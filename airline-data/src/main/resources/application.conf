websocketActorSystem {
	pekko {
		actor {
			provider = remote
			allow-java-serialization = on
			warn-about-java-serializer-usage = false
		}
		remote {
			artery {
				transport = tcp
				canonical {
					#private IP of this server
					hostname = "127.0.0.1"
					port = 2552
				}
				bind {
					hostname = "127.0.0.1"
					port = 2552
				}
	    	}
		}
	}
}

mysqldb {
    host = "localhost:3306"
    schema = "airline"
    user = "root"
    password = ""
}

hikari.maxPoolSize = 8
hikari.minimumIdle = 2
hikari.connectionTimeout = 90000

# Bounded thread pool backing the simulation actor system.
# Defaults to max(4, number of CPU cores) when unset.
# simulation.threadPoolSize = 4

# Pause-when-idle (single-player): skip simulation cycles while no player has
# been active. The web app records activity (login + connected websocket
# sessions) in the activity_heartbeat table; deploy web and sim from the same
# version when enabling. Game time stops while paused; no catch-up on return.
# simulation.pauseWhenIdle = true
# simulation.idleGraceMinutes = 60
# simulation.idleRecheckMinutes = 5

# Single-player economy tuning (see com.patson.data.SoloConfig). Every key
# defaults to the upstream value, so leaving them unset is identical to vanilla.
# Set on the relevant process (these read whichever config the JVM loaded, and
# also honor -Dsolo.* system properties):
#   simulation process: ap / loan / bankruptcy keys
#   web process (sign-up): startingBalance / minRenewalBalance
# solo.startingBalance = 25000000          # new airline starting cash (default 0)
# solo.minRenewalBalance = 100000          # default 300000
# solo.ap.generationRate = 0.3             # action points/week/manager (default 0.1)
# solo.ap.maxCyclesStored = 96             # default 96 (24*4)
# solo.loan.defaultAnnualRate = 0.06       # default 0.11
# solo.bankruptcy.cashThreshold = -25000000   # default -10000000
# solo.bankruptcy.assetsThreshold = -150000000 # default -100000000
# Financial notifications for player airlines (simulation process):
# solo.notify.enabled = true               # default false
# solo.notify.cashWarningThreshold = 5000000   # warn below this balance
# solo.notify.profitMilestone = 10000000       # praise above this weekly profit
# solo.notify.intervalCycles = 4           # throttle: emit at most every N cycles
